<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Integrated LRN-Based Student Progression Tracking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(0,103,177,0.34), transparent 34rem),
        linear-gradient(135deg, #06162f 0%, #102a63 46%, #0b3c69 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Century Gothic", CenturyGothic, Arial, sans-serif;
      font-size: 12px;
      padding: 18px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #f8fbff;
      border-radius: 22px;
      padding: 28px 26px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }

    .login-title {
      font-weight: 800;
      color: #12376f;
      font-size: 20px;
    }

    .login-subtitle {
      color: #5d6f91;
      font-size: 12px;
      line-height: 1.5;
    }

    .form-label {
      color: #12376f;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-control {
      border: 1px solid #d7e1ef;
      border-radius: 10px;
      font-size: 12px;
      min-height: 40px;
    }

    .btn-login {
      align-items: center;
      display: inline-flex;
      height: 40px;
      justify-content: center;
      border-radius: 10px;
      background: #0067b1;
      border: none;
      font-weight: 700;
      color: white;
      font-size: 12px;
      text-decoration: none;
      width: 100%;
    }

    .btn-login:hover {
      background: #00528d;
      color: white;
    }

    .back-link {
      color: #0067b1;
      font-weight: 700;
      text-decoration: none;
    }

    .recovery-note {
      background: #eaf3ff;
      border: 1px solid #cfe2ff;
      border-radius: 12px;
      color: #36557f;
      font-size: 11px;
      line-height: 1.45;
      padding: 10px 12px;
      text-align: left;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center">
      <h3 class="login-title mb-2">Password Recovery</h3>
      <p class="login-subtitle mb-4">Use the local recovery key to set a new password for an account.</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-warning py-2 mb-3 text-start" role="alert">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    {% if reset_key_path %}
      <div class="recovery-note mb-3">
        Recovery key file: {{ reset_key_path }}
      </div>
    {% endif %}

    <form action="/forgot-password" method="POST">
      <div class="mb-3 text-start">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label">Recovery Key</label>
        <input type="password" name="reset_key" class="form-control" placeholder="Enter recovery key" required>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" placeholder="At least 8 characters" minlength="8" required>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="8" required>
      </div>

      <button type="submit" class="btn btn-login mt-1">Reset Password</button>
    </form>

    <div class="text-center mt-3">
      <a href="/login" class="back-link">Back to Login</a>
    </div>
  </div>
</body>
</html>
